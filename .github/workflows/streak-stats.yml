name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dark mode streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: 'user=${{ github.repository_owner }}&background=0D1117&border=30363D&stroke=30363D&ring=58A6FF&fire=A371F7&currStreakNum=58A6FF&sideNums=A371F7&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E&disable_animations=true'
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light mode streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: 'user=${{ github.repository_owner }}&background=FFFFFF&border=D0D7DE&stroke=D8DEE4&ring=2563EB&fire=7C3AED&currStreakNum=2563EB&sideNums=7C3AED&currStreakLabel=2563EB&sideLabels=57606A&dates=57606A&disable_animations=true'
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          git commit -m "Update streak stats" || exit 0
          git push